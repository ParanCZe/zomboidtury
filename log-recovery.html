<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BO1Z – Obnova protokolu</title><style>body{background:#08101c;color:#eef5ff;font:16px system-ui;padding:18px;max-width:900px;margin:auto}button{border:1px solid #6e84a0;background:#233953;color:white;padding:13px;border-radius:12px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#030811;padding:15px;border-radius:12px;user-select:text;-webkit-user-select:text}h1{font-size:23px}#status{color:#add8c5}</style></head><body><h1>BO1Z – obnovení posledního logu</h1><p>Tato stránka nespouští engine ani WASM. Čte poslední protokol uložený tímto webem.</p><button id="load">Načíst uložený log</button><button id="copy">Kopírovat</button><button id="save">Uložit .txt</button><p id="status">Připraveno.</p><pre id="output">Stiskni Načíst uložený log.</pre><script>(()=>{const el=id=>document.getElementById(id);let value="";function load(){try{value=localStorage.getItem("bo1z-last-engine-log-v269")||"";el("output").textContent=value||"Žádný uložený log nenalezen. Vrať se do mobile.html a spusť verzi v2.6.9 nebo novější.";el("status").textContent=value?"Načteno "+value.length+" znaků.":"Protokol nenalezen."}catch(e){el("status").textContent=e.message}}el("load").onclick=load;el("copy").onclick=async()=>{try{await navigator.clipboard.writeText(value);el("status").textContent="Zkopírováno."}catch(e){el("status").textContent="Kopírování selhalo; text můžeš označit v poli níže."}};el("save").onclick=()=>{if(!value){load();if(!value)return}const u=URL.createObjectURL(new Blob([value],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="bo1z-recovered-log.txt";a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)};load()})();</script></body></html>

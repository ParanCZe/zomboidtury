name: Rebuild experimental mobile Zombies engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile-port.patch.gz
      - tools/instrument_boot.py
      - .github/workflows/engine-build.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: mobile-engine-build
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.69
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore and apply pinned engine source
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/riicchhaarrd/KisakBlack.git engine-source
          git -C engine-source checkout 65d1eb9a21898ae43b27f93e8204dc5d03560d70
          gzip -dc mobile-port.patch.gz > engine.patch
          git -C engine-source apply --check ../engine.patch
          git -C engine-source apply ../engine.patch
          python3 tools/instrument_boot.py --self-test
          python3 tools/instrument_boot.py engine-source
          grep -q 'FS_InitFilesystem: after FS_Startup' engine-source/src/universal/com_files.cpp
      - name: Verify portable input and file readers
        shell: bash
        run: |
          cd engine-source
          node tests/mobile_keys_test.cjs
          g++ -std=c++20 -I tests/fake_emscripten tests/web_fiber_yield_test.cpp -o /tmp/web-fiber-yield-test
          /tmp/web-fiber-yield-test
          g++ -std=c++20 tests/dxt_decode_test.cpp -o /tmp/dxt-decode-test
          /tmp/dxt-decode-test
          g++ -std=c++20 -I src tests/raw_fastfile_test.cpp src/database/db_raw.cpp -o /tmp/raw-fastfile-test
          /tmp/raw-fastfile-test
          g++ -std=c++20 tests/mobile_motion_test.cpp src/platform/sdl/mobile_motion.cpp -o /tmp/mobile-motion-test
          /tmp/mobile-motion-test
          g++ -std=c++20 tests/msg_round_float_test.cpp src/qcommon/msg_round_float.cpp -o /tmp/round-float-test
          /tmp/round-float-test
      - name: Compile unthreaded Asyncify engine
        shell: bash
        run: |
          emcmake cmake -S engine-source -B engine-build -DCMAKE_BUILD_TYPE=Release -DKISAK_WEB_THREADS=OFF -DKISAK_WEB_ASSERTIONS=ON
          cmake --build engine-build --parallel 4
      - name: Validate compiled Wasm and package current player
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const bytes = fs.readFileSync('engine-build/web/blackops.wasm');
          const crypto = require('node:crypto');
          const wasmSha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          for (const phase of ['FS_InitFilesystem: after FS_Startup', 'Com_Init: before Cbuf_Execute']) {
            if (!bytes.includes(Buffer.from(phase))) throw new Error('Boot diagnostic phase is missing in compiled Wasm: ' + phase);
          }
          if (!WebAssembly.validate(bytes)) throw new Error('Invalid WebAssembly');
          const compiled = new WebAssembly.Module(bytes);
          const exportedNames = new Set(WebAssembly.Module.exports(compiled).map(e => e.name));
          for (const name of ['__main_argc_argv', 'KBMobile_Reset', 'KBMobile_Enable', 'KBMobile_Key', 'KBMobile_Look', 'KBMobile_Pointer', 'asyncify_start_unwind', 'asyncify_stop_unwind']) {
            if (!exportedNames.has(name)) throw new Error('Missing engine export: ' + name);
          }
          const imports = {};
          for (const entry of WebAssembly.Module.imports(compiled)) {
            if (entry.kind !== 'function') throw new Error('Unexpected non-function import: ' + entry.name);
            imports[entry.module] ??= {};
            imports[entry.module][entry.name] = () => 0;
          }
          const instance = new WebAssembly.Instance(compiled, imports);
          const memory = Object.values(instance.exports).find(value => value instanceof WebAssembly.Memory);
          if (!memory || memory.buffer instanceof SharedArrayBuffer || memory.buffer.byteLength !== 512 * 1048576) throw new Error('Expected unshared 512 MiB initial memory');
          console.log('Wasm exports, Asyncify and unshared 512 MiB memory verified. Game initialization is not tested here.');
          fs.mkdirSync('engine-artifact', {recursive:true});
          for (const name of fs.readdirSync('.')) if (/\.(html|js|css)$/.test(name) && name !== 'blackops.js') fs.copyFileSync(name, 'engine-artifact/' + name);
          fs.copyFileSync('engine-build/web/blackops.js', 'engine-artifact/blackops.js');
          const partNames = [];
          for (let offset = 0, part = 1; offset < bytes.length; offset += 7999998, part++) {
            const name = 'blackops.wasm.' + String(part).padStart(3, '0');
            partNames.push(name);
            fs.writeFileSync('engine-artifact/' + name, bytes.subarray(offset, offset + 7999998));
          }
          if (partNames.length !== 3) throw new Error('Expected exactly three Wasm segments; web deployment assumes three');
          const loader = fs.readFileSync('engine-artifact/engine-loader.js', 'utf8');
          fs.writeFileSync('engine-artifact/engine-loader.js', loader.replace(/for \(const name of \[.*?\]\)/, 'for (const name of ' + JSON.stringify(partNames) + ')'));
          fs.writeFileSync('engine-artifact/BUILD.json', JSON.stringify({source:'65d1eb9a21898ae43b27f93e8204dc5d03560d70', emscripten:'3.1.69', wasmBytes:bytes.length, wasmSha256, commit:process.env.GITHUB_SHA, instrumentedBoot:true, gameplayVerified:false}, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-mobile-zombies-engine
          path: engine-artifact/
          retention-days: 14

  publish:
    name: Publish verified engine on GitHub runner
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: experimental-mobile-zombies-engine
          path: engine-artifact
      - name: Verify artifact content before replacing live engine
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const meta=JSON.parse(fs.readFileSync('engine-artifact/BUILD.json','utf8'));
          const parts=['001','002','003'].map(s=>fs.readFileSync('engine-artifact/blackops.wasm.'+s));
          const bytes=Buffer.concat(parts);
          if(bytes.length!==meta.wasmBytes) throw new Error('Size mismatch between build metadata and artifact');
          if(crypto.createHash('sha256').update(bytes).digest('hex')!==meta.wasmSha256) throw new Error('Engine artifact integrity failure');
          if(meta.instrumentedBoot!==true) throw new Error('New engine lacks boot checkpoints');
          if(!WebAssembly.validate(bytes)) throw new Error('New Wasm invalid');
          if(!fs.statSync('engine-artifact/blackops.js').size) throw new Error('New JS engine missing');
          console.log('Verified traced engine: '+meta.wasmBytes+' bytes');
          JS
      - name: Commit traced engine from checked-out repository
        shell: bash
        run: |
          set -euo pipefail
          cp engine-artifact/blackops.js ./blackops.js
          for part in 001 002 003; do cp "engine-artifact/blackops.wasm.$part" "./blackops.wasm.$part"; done
          cp engine-artifact/BUILD.json ./ENGINE_BUILD.json
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blackops.js blackops.wasm.001 blackops.wasm.002 blackops.wasm.003 ENGINE_BUILD.json
          if ! git diff --cached --quiet; then
            git commit -m "build: publish instrumented BO1Z WebAssembly engine"
            git push origin HEAD:main
          fi
      - name: Deploy compiled engine and complete map pack
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/kino-pages.yml/dispatches" \
            -d '{"ref":"main"}'

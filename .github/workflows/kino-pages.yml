name: Build Kino data and deploy mobile Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mobile-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified game data
        uses: actions/cache@v4
        with:
          path: pack-cache
          key: kino-${{ hashFiles('kino-manifest.json') }}
      - name: Download and verify pinned Kino pack
        run: python3 tools/prepare_kino.py --destination pack-cache
      - name: Assemble website
        run: |
          mkdir -p site/game
          cp *.html *.js *.css blackops.wasm.* site/
          cp -a pack-cache/. site/game/
          touch site/.nojekyll
          test "$(du -sb site | cut -f1)" -lt 1073741824
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build Kino data and deploy mobile Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: mobile-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser code, engine and game manifest
        run: |
          node tools/prepare-engine-manifest.cjs
          node --test tests/*.test.cjs
          python3 -m py_compile tools/prepare_kino.py
      - name: Restore verified game data
        uses: actions/cache@v4
        with:
          path: pack-cache
          key: kino-${{ hashFiles('kino-manifest.json') }}
      - name: Download and verify pinned Kino pack
        run: python3 tools/prepare_kino.py --destination pack-cache
      - name: Assemble website
        run: |
          mkdir -p site/game
          cp *.html *.js *.css blackops.wasm.* engine-manifest.json site/
          cp -a pack-cache/. site/game/
          touch site/.nojekyll
          test "$(du -sb site | cut -f1)" -lt 1073741824
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A repository with legacy Pages enabled also starts a branch deployment.
      # Wait for that run so it cannot overwrite the complete data artifact.
      - name: Wait for legacy branch Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(run => run.path === 'dynamic/pages/pages-build-deployment');
              if (legacy.every(run => run.status === 'completed')) return;
              core.info('Waiting for branch Pages deployment before publishing the complete Kino pack.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Legacy Pages deployment did not finish within ten minutes.');
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-check live page, launcher and required Kino archive
        shell: bash
        run: |
          set -euo pipefail
          base="https://parancze.github.io/zomboidtury"
          for attempt in $(seq 1 20); do
            echo "Public site check: attempt ${attempt}/20"
            if curl -fsSL --max-time 30 "${base}/game/manifest.json?check=${GITHUB_SHA}" -o /tmp/bo1z-live-manifest.json &&
               curl -fsSL --max-time 30 "${base}/engine-loader.js?check=${GITHUB_SHA}" -o /tmp/bo1z-live-loader.js &&
               curl -fsSL --max-time 30 "${base}/engine-manifest.json?check=${GITHUB_SHA}" -o /tmp/bo1z-live-engine.json &&
               curl -fsSIL --max-time 30 "${base}/game/main/localized_English_iw04.iwd?check=${GITHUB_SHA}" -o /dev/null &&
               python3 - <<'PY'
          import json, pathlib
          manifest=json.loads(pathlib.Path('/tmp/bo1z-live-manifest.json').read_text())
          assert manifest.get('map') == 'zombie_theater', 'Wrong live map'
          assert len(manifest.get('files', [])) == 51, 'Incomplete live file list'
          loader=pathlib.Path('/tmp/bo1z-live-loader.js').read_text()
          assert '180 sekund' in loader and 'script.integrity' in loader, 'Stale live loader'
          engine=json.loads(pathlib.Path('/tmp/bo1z-live-engine.json').read_text())
          assert engine.get('wasmBytes', 0)>10000000 and all(len(engine.get(k, ''))==64 for k in ('wasmSha256','runtimeSha256')), 'Missing engine pair manifest'
          print('Live Pages: manifest, game archive and latest loader verified.')
          PY
            then
              exit 0
            fi
            sleep 8
          done
          echo "ERROR: Deployed GitHub Pages did not pass live smoke test" >&2
          exit 1

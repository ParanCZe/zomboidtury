<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BO1Z Renderer Bridge – feasibility</title><style>body{font:15px system-ui;background:#101115;color:#f2f2f2;max-width:760px;margin:25px auto;padding:14px}button,input{font:inherit;padding:12px;margin:8px 0}button{background:#dfbb52;color:#111;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e2026;padding:12px;border-radius:8px}small{color:#bcbcbc}</style></head><body><h1>BO1Z – Renderer Bridge</h1><p>Experiment s originálním WASM. Ověříme, zda je grafický backend možné podchytit přes JavaScript importy, bez změny souboru a bez načtení 2GB paměti.</p><input id="file" type="file" accept=".wasm,application/wasm"><p><button id="scan">Prověřit originální WASM</button> <button id="save">Uložit výsledek</button></p><pre id="out">Vyber původní KisakBlack-web.wasm.</pre><small>Herní data ani WASM se nikam neodesílají. Analyzuje se lokálně v prohlížeči.</small><script>
const out=document.querySelector("#out");let report="";
function write(s){report+=s+"\n";out.textContent=report}
document.querySelector("#scan").onclick=async()=>{report="";const f=document.querySelector("#file").files[0];if(!f){write("Chybí WASM soubor.");return}try{write("SOUBOR "+f.name+" bytes="+f.size);const m=await WebAssembly.compile(await f.arrayBuffer());const imp=WebAssembly.Module.imports(m),exp=WebAssembly.Module.exports(m);write("IMPORTY "+imp.length+" EXPORTY "+exp.length);const relevant=/gl|webgpu|render|d3d|device|canvas|context|emscripten_webgl|proxy/i;let candidates=0;for(const x of imp){if(relevant.test(x.name)||relevant.test(x.module)){write("GRAPHICS IMPORT "+x.module+"."+x.name+" "+x.kind);candidates++}}write("RELEVANT GRAPHICS IMPORTS "+candidates);write("ALL IMPORT MODULES "+[...new Set(imp.map(x=>x.module))].join(", "));write("IMPORT FUNCTION COUNT "+imp.filter(x=>x.kind==="function").length);for(const x of exp.filter(x=>relevant.test(x.name)).slice(0,60))write("GRAPHICS EXPORT "+x.name+" "+x.kind);if(!candidates)write("ZÁVĚR: Na hranici JavaScript/WASM není podle názvů vidět grafický import. Přímé přesměrování Direct3DCreate9/CreateDevice přes JS není prokázáno; pravděpodobně bude nutná oprava WASM nebo kompilace zdrojů.");else write("ZÁVĚR: Existují potenciální body napojení. Názvy samy o sobě ovšem neprokazují, že přes ně prochází CreateDevice.");}catch(e){write("CHYBA "+e.name+" "+e.message)}};
document.querySelector("#save").onclick=()=>{const u=URL.createObjectURL(new Blob([report],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="bo1z-renderer-bridge-audit.txt";a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
</script></body></html>
